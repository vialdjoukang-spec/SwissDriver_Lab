<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>SwissDriver Lab · Simulateur modernisé</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf5ff;color:#152738;font:600 16px/1.5 Arial,sans-serif}#game{display:block;width:100%;height:100%;border:0}#notice{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:10;background:white;border:1px solid #aec6d9;border-radius:10px;padding:8px 12px;box-shadow:0 2px 10px #0002}#notice[hidden]{display:none}</style></head><body><p id="notice" role="status">Chargement du simulateur…</p><iframe id="game" src="./Permis_GT_Rossa.html" title="Simulateur de conduite SwissDriver Lab" allow="fullscreen" referrerpolicy="same-origin"></iframe><script>
const frame=document.getElementById('game'),notice=document.getElementById('notice');
frame.addEventListener('load',async()=>{try{const doc=frame.contentDocument;if(!doc)throw Error('Accès au document impossible');const res=await fetch('./swissdriver-modern.css');if(!res.ok)throw Error('Feuille de style introuvable');const style=doc.createElement('style');style.textContent=await res.text();doc.head.appendChild(style);notice.hidden=true;}catch(err){notice.textContent='Simulation d’origine chargée ; apparence modernisée indisponible ('+err.message+').';console.warn(err);}});
</script></body></html>
