name: SwissDriver Pages
# First select Settings > Pages > Source > GitHub Actions. This workflow
# deliberately does not attempt to grant itself administrative permissions.
# It never rebuilds: it deploys only the edition already verified by a
# successful "SwissDriver quality" push run for this exact main commit.
on:
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: 'ID of the successful SwissDriver quality run on main for this commit'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: swissdriver-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.quality_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require a successful full-quality run for this exact commit
        run: |
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::quality_run_id must be numeric"; exit 1;; esac
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os, sys
          run = json.load(open('run.json'))
          expected = {'path': '.github/workflows/swissdriver-quality.yml', 'head_sha': os.environ['GITHUB_SHA'],
                      'head_branch': 'main', 'event': 'push', 'status': 'completed', 'conclusion': 'success'}
          wrong = {k: run.get(k) for k, v in expected.items() if (run.get(k) or '').split('@')[0] != v}
          if wrong:
              sys.exit('Quality run refused: ' + json.dumps(wrong))
          PY
      - name: Retrieve the edition of that run and verify commit, HTML and all evidence
        run: |
          gh run download "$RUN_ID" --name swissdriver-edition --dir release
          python3 scripts/evidence.py release "$GITHUB_SHA"
          mkdir site
          cp release/SwissDriver_Lab.html site/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy the configured Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
